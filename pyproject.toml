[project]
name = "docs-rag"
version = "0.1.0"
description = "Local RAG layer + MCP server for the docs vault"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "elasticsearch>=8.13,<9",
    "mcp>=1.2",
    "markdown-it-py>=3.0",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
