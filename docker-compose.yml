name: docs-rag

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: docs-rag-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: docs-rag-ollama
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: docs-rag-app:latest
    container_name: docs-rag-app
    environment:
      - ES_URL=http://elasticsearch:9200
      - OLLAMA_URL=http://ollama:11434
      - DOCS_ROOT=/docs
      - EMBED_MODEL=nomic-embed-text
      - EMBED_DIMS=768
      - INDEX_NAME=docs
    volumes:
      - ${DOCS_ROOT_HOST:-/Users/adarsh.consultant/Documents/docs}:/docs:ro
    ports:
      - "127.0.0.1:${HOST_PORT:-49823}:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    image: docs-rag-app:latest
    container_name: docs-rag-mcp
    command: ["python", "-m", "src.mcp_server"]
    environment:
      - ES_URL=http://elasticsearch:9200
      - OLLAMA_URL=http://ollama:11434
      - EMBED_MODEL=nomic-embed-text
      - EMBED_DIMS=768
      - INDEX_NAME=docs
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8001
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8001/mcp/ -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"hc\",\"version\":\"1\"}}}' | grep -qE '^(200|307)$'"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      app:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: docs-rag-agent:latest
    container_name: docs-rag-agent
    environment:
      - MCP_URL=http://mcp:8001/mcp/
      - APP_URL=http://app:8000
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    ports:
      - "127.0.0.1:${AGENT_PORT:-52891}:8000"
    depends_on:
      mcp:
        condition: service_started
    restart: unless-stopped

volumes:
  es-data:
  ollama-data:
