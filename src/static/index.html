<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ask docs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
/* ── BRAND TOKENS ──────────────────────────────────────────────────────────── */
:root {
  --bg-base:       #0A0A0B;
  --bg-surface:    #111113;
  --bg-raised:     #18181C;
  --bg-overlay:    #1F1F25;
  --border-subtle: #1E1E24;
  --border-soft:   #2A2A34;
  --border-mid:    #3A3A48;
  --text-primary:   #F0EEF8;
  --text-secondary: #9997AA;
  --text-muted:     #5C5A6E;
  --text-disabled:  #3A3848;
  --accent:        #7C6EFA;
  --accent-bright: #9B8FFB;
  --accent-dim:    #4A3FCC;
  --accent-glow:     rgba(124,110,250,0.15);
  --accent-subtle:   rgba(124,110,250,0.08);
  --accent-contrast: #ffffff;
  --accent-border:  rgba(124,110,250,0.2);
  --success: #3DD68C;
  --warning: #F5A623;
  --error:   #F2546A;
  --info:    #4AA8FF;
  --success-bg:    rgba(61,214,140,0.08);
  --warning-bg:    rgba(245,166,35,0.08);
  --error-bg:      rgba(242,84,106,0.08);
  --info-bg:       rgba(74,168,255,0.08);
  --success-border: rgba(61,214,140,0.2);
  --warning-border: rgba(245,166,35,0.2);
  --error-border:   rgba(242,84,106,0.2);
  --info-border:    rgba(74,168,255,0.2);
  --bg-hover:   #1A1A1F;
  --bg-active:  #212127;
  --accent-hover:  #8D80FB;
  --accent-active: #6B5CE8;
  --border-hover:  #454558;
  --border-focus:  #7C6EFA;
  --brand-font-display: 'Syne', sans-serif;
  --brand-font-body:    'DM Sans', sans-serif;
  --brand-font-mono:    'DM Mono', monospace;
  --brand-font-regular:  400;
  --brand-font-medium:   500;
  --brand-font-semibold: 600;
  --brand-font-bold:     700;
  --brand-radius-sm:   4px;
  --brand-radius-md:   8px;
  --brand-radius-lg:   12px;
  --brand-radius-xl:   16px;
  --brand-radius-2xl:  24px;
  --brand-radius-full: 9999px;
  --brand-shadow-sm:     0 1px 2px rgba(0,0,0,0.4);
  --brand-shadow-md:     0 4px 16px rgba(0,0,0,0.5);
  --brand-shadow-lg:     0 12px 40px rgba(0,0,0,0.6);
  --brand-shadow-accent: 0 0 24px rgba(124,110,250,0.25);
  --brand-ease-out:    cubic-bezier(0.16,1,0.3,1);
  --brand-ease-in-out: cubic-bezier(0.4,0,0.2,1);
  --brand-duration-fast: 120ms;
  --brand-duration-base: 220ms;
  --brand-duration-slow: 400ms;
}
[data-theme="light"] {
  --bg-base:       #FAFAFA;
  --bg-surface:    #FFFFFF;
  --bg-raised:     #F4F4F6;
  --bg-overlay:    #EEEEF2;
  --border-subtle: #E8E8EF;
  --border-soft:   #D8D8E4;
  --border-mid:    #C0C0D0;
  --text-primary:   #0D0C14;
  --text-secondary: #4A4860;
  --text-muted:     #7A788C;
  --text-disabled:  #B0AEC4;
  --accent:        #6B5CE8;
  --accent-bright: #7C6EFA;
  --accent-dim:    #4A3FCC;
  --accent-glow:     rgba(107,92,232,0.12);
  --accent-subtle:   rgba(107,92,232,0.06);
  --accent-border:  rgba(107,92,232,0.20);
  --success: #1F9E62;
  --error:   #C62B44;
  --success-bg: rgba(31,158,98,0.08);
  --error-bg:   rgba(198,43,68,0.08);
  --success-border: rgba(31,158,98,0.20);
  --error-border:   rgba(198,43,68,0.20);
  --info-border:    rgba(26,114,204,0.20);
  --bg-hover:  #EFEFF4;
  --bg-active: #E5E5ED;
  --accent-hover:  #7C6EFA;
  --accent-active: #5D4FD6;
  --border-hover:  #A8A8BE;
  --border-focus:  #6B5CE8;
  --brand-shadow-sm:     0 1px 2px rgba(0,0,0,0.08);
  --brand-shadow-md:     0 4px 16px rgba(0,0,0,0.10);
  --brand-shadow-lg:     0 12px 40px rgba(0,0,0,0.14);
}

/* ── RESET & BASE ─────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body, #root {
  height: 100%; margin: 0;
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--brand-font-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; cursor: pointer; }

/* ── COSMIC BACKGROUND ───────────────────────────────────────────────────── */
.cosmic-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.cosmic-orb {
  position: absolute; border-radius: 50%; filter: blur(60px);
  opacity: var(--orb-opacity, 1);
  animation: orb-breathe 18s ease-in-out infinite;
  will-change: transform, opacity;
}
.cosmic-orb.primary {
  top: -20vh; right: -10vw; width: 70vw; height: 70vw;
  max-width: 1100px; max-height: 1100px;
  background: radial-gradient(circle at 30% 30%,
    rgba(124,110,250,0.45) 0%, rgba(124,110,250,0.20) 30%,
    rgba(124,110,250,0.05) 55%, transparent 75%);
}
.cosmic-orb.secondary {
  bottom: -30vh; left: -15vw; width: 60vw; height: 60vw;
  max-width: 900px; max-height: 900px;
  background: radial-gradient(circle at 60% 50%,
    rgba(74,168,255,0.16) 0%, rgba(124,110,250,0.10) 35%, transparent 70%);
  animation-delay: -9s;
}
@keyframes orb-breathe {
  0%, 100% { transform: scale(1) translate(0,0); opacity: var(--orb-opacity, 1); }
  50%       { transform: scale(1.08) translate(2%,-1%); opacity: calc(var(--orb-opacity, 1) * 0.85); }
}
.starfield {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(0.8px 0.8px at 12% 22%, rgba(255,255,255,0.55), transparent),
    radial-gradient(0.6px 0.6px at 28% 64%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1px   1px   at 47% 18%, rgba(200,190,255,0.45), transparent),
    radial-gradient(0.5px 0.5px at 62% 78%, rgba(255,255,255,0.40), transparent),
    radial-gradient(0.8px 0.8px at 78% 32%, rgba(255,255,255,0.60), transparent),
    radial-gradient(0.6px 0.6px at 88% 70%, rgba(255,255,255,0.30), transparent),
    radial-gradient(0.7px 0.7px at 18% 84%, rgba(255,255,255,0.40), transparent),
    radial-gradient(0.5px 0.5px at 38% 38%, rgba(155,143,251,0.45), transparent),
    radial-gradient(0.6px 0.6px at 70% 12%, rgba(255,255,255,0.35), transparent),
    radial-gradient(0.4px 0.4px at 92% 50%, rgba(255,255,255,0.30), transparent);
  background-size: 100% 100%; opacity: 0.6;
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 85%);
}
.cosmic-vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 100% 80% at 50% 50%, transparent 30%, rgba(10,10,11,0.6) 100%);
}
[data-theme="light"] .cosmic-orb.primary {
  background: radial-gradient(circle at 30% 30%, rgba(107,92,232,0.30) 0%, rgba(107,92,232,0.14) 30%, transparent 65%);
}
[data-theme="light"] .cosmic-orb.secondary {
  background: radial-gradient(circle at 60% 50%, rgba(26,114,204,0.12) 0%, rgba(107,92,232,0.08) 35%, transparent 70%);
}
[data-theme="light"] .starfield { display: none; }
[data-theme="light"] .cosmic-vignette {
  background: radial-gradient(ellipse 100% 80% at 50% 50%, transparent 30%, rgba(250,250,250,0.4) 100%);
}

/* ── SHELL ───────────────────────────────────────────────────────────────── */
.shell { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

/* ── HEADER ──────────────────────────────────────────────────────────────── */
.app-header {
  position: relative; z-index: 2; padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  flex-shrink: 0; border-bottom: 1px solid var(--border-subtle);
  background: linear-gradient(180deg, rgba(10,10,11,0.6), rgba(10,10,11,0));
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
[data-theme="light"] .app-header {
  background: linear-gradient(180deg, rgba(250,250,250,0.7), rgba(250,250,250,0));
}
.wordmark { display: flex; align-items: center; gap: 10px; }
.wordmark .title {
  font-family: var(--brand-font-display); font-weight: 700; font-size: 17px;
  letter-spacing: -0.02em; color: var(--text-primary);
}
.wordmark .accent-dot { color: var(--accent); }
.header-actions { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--brand-radius-md); border: 1px solid var(--border-soft);
  background: var(--bg-raised); color: var(--text-secondary);
  transition: all var(--brand-duration-fast) var(--brand-ease-out);
}
.icon-btn:hover { color: var(--text-primary); border-color: var(--border-mid); background: var(--bg-hover); }
.icon-btn svg { width: 16px; height: 16px; }
.btn-new {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 10px;
  border-radius: var(--brand-radius-md); border: 1px solid var(--border-soft);
  background: var(--bg-raised); color: var(--text-primary);
  font-size: 13px; font-weight: 500;
  transition: all var(--brand-duration-fast) var(--brand-ease-out);
}
.btn-new:hover { border-color: var(--border-mid); background: var(--bg-hover); }
.btn-new .kbd {
  font-family: var(--brand-font-mono); font-size: 10px; color: var(--text-muted);
  padding: 1px 5px; border: 1px solid var(--border-soft); border-radius: 4px;
  background: var(--bg-base); margin-left: 4px;
}
.btn-new svg { width: 14px; height: 14px; opacity: 0.8; }
.index-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 10px 4px 8px; border-radius: var(--brand-radius-full);
  border: 1px solid var(--border-subtle); background: var(--bg-surface);
  font-family: var(--brand-font-mono); font-size: 10px;
  letter-spacing: 0.04em; color: var(--text-muted);
}
.index-pill .pulse-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--success); box-shadow: 0 0 8px rgba(61,214,140,0.5);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50%       { opacity: 1;   transform: scale(1.2); }
}
.theme-toggle-btn {
  width: 32px; height: 32px; border-radius: var(--brand-radius-md);
  border: 1px solid var(--border-soft); background: var(--bg-raised);
  color: var(--text-secondary); display: inline-flex; align-items: center; justify-content: center;
  transition: all var(--brand-duration-fast) var(--brand-ease-out);
}
.theme-toggle-btn:hover { color: var(--text-primary); border-color: var(--border-mid); }
.theme-toggle-btn svg { width: 16px; height: 16px; }
.key-chip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
  border-radius: var(--brand-radius-md); border: 1px solid var(--border-soft);
  background: var(--bg-raised); color: var(--text-secondary);
  font-family: var(--brand-font-mono); font-size: 11px; letter-spacing: 0.04em;
  transition: all var(--brand-duration-fast) var(--brand-ease-out);
}
.key-chip:hover { color: var(--text-primary); border-color: var(--border-mid); background: var(--bg-hover); }
.key-chip svg { width: 12px; height: 12px; color: var(--success); flex-shrink: 0; }
.key-chip .mask { color: var(--text-muted); }
.key-chip .last4 { color: var(--text-primary); font-weight: 500; }

/* ── CHAT REGION ─────────────────────────────────────────────────────────── */
.chat-region { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; }
.chat-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--border-soft) transparent;
}
.chat-scroll::-webkit-scrollbar { width: 8px; }
.chat-scroll::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 4px; }
.chat-inner { max-width: 760px; margin: 0 auto; padding: 32px 24px 200px; }
.chat-inner.is-empty { padding: 0 24px 24px; }

/* ── EMPTY STATE ─────────────────────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: calc(100vh - 220px); padding: 32px 24px 24px;
  text-align: center; width: 100%; max-width: 580px; margin: 0 auto;
}
.empty-orb-wrap {
  position: relative; width: 80px; height: 80px;
  display: flex; align-items: center; justify-content: center; margin-bottom: 28px;
}
.empty-orb {
  width: 56px; height: 56px; border-radius: 50%;
  background: radial-gradient(circle at 36% 32%, #eeeaff 0%, #b8b0f0 38%, #7c74c4 75%, #4e4890 100%);
  box-shadow: 0 0 0 2px rgba(124,110,250,0.45), 0 0 24px rgba(124,110,250,0.55), 0 4px 12px rgba(0,0,0,0.5);
  position: relative; animation: moon-float 6s ease-in-out infinite;
}
.empty-orb::before {
  content: ''; position: absolute; width: 36%; height: 36%;
  border-radius: 50%; background: rgba(60,50,120,0.30); top: 18%; left: 20%;
  box-shadow: 7px -1px 0 1.5px rgba(60,50,120,0.22), 2px 9px 0 1px rgba(60,50,120,0.18);
}
@keyframes moon-float {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-6px); }
}
.empty-orb-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid rgba(124,110,250,0.18);
  animation: ring-expand 4s ease-out infinite;
}
@keyframes ring-expand {
  0%   { transform: scale(0.8); opacity: 0; }
  20%  { opacity: 0.6; }
  100% { transform: scale(1.5); opacity: 0; }
}
.empty-eyebrow {
  font-family: var(--brand-font-mono); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px;
  display: inline-flex; align-items: center; gap: 10px;
}
.empty-eyebrow .line { display: inline-block; width: 24px; height: 1px; background: var(--border-mid); }
.empty-hero {
  font-family: var(--brand-font-display); font-weight: 700;
  font-size: clamp(2.4rem, 5vw, 3.2rem); line-height: 1; letter-spacing: -0.025em;
  color: var(--text-primary); margin: 0 0 12px;
}
.empty-hero .accent { color: var(--accent); }
.empty-sub { font-size: 15px; color: var(--text-secondary); max-width: 480px; line-height: 1.55; margin: 0 0 36px; }
.suggested-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px; width: 100%; max-width: 580px; margin-bottom: 28px;
}
.suggest-card {
  text-align: left; background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--brand-radius-lg); padding: 14px 16px; color: var(--text-secondary);
  font-size: 13px; line-height: 1.5; display: flex; align-items: flex-start; gap: 10px;
  transition: all var(--brand-duration-fast) var(--brand-ease-out);
  position: relative; overflow: hidden;
}
.suggest-card::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 0% 0%, var(--accent-subtle) 0%, transparent 60%);
  opacity: 0; transition: opacity var(--brand-duration-base) var(--brand-ease-out); pointer-events: none;
}
.suggest-card:hover { border-color: var(--accent-border); color: var(--text-primary); transform: translateY(-1px); }
.suggest-card:hover::before { opacity: 1; }
.suggest-card .icon {
  flex-shrink: 0; width: 22px; height: 22px; display: inline-flex;
  align-items: center; justify-content: center; border-radius: 6px;
  background: var(--accent-subtle); border: 1px solid var(--accent-border); color: var(--accent-bright);
}
.suggest-card .icon svg { width: 12px; height: 12px; }
.suggest-card .label {
  font-family: var(--brand-font-mono); font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 2px; display: block;
}
.suggest-card .text { display: block; color: inherit; }

/* ── MESSAGES ────────────────────────────────────────────────────────────── */
.msg-pair { display: flex; flex-direction: column; gap: 24px; margin-bottom: 32px; }
.msg-user {
  align-self: flex-end; max-width: 80%; padding: 10px 16px;
  background: var(--accent-subtle); border: 1px solid var(--accent-border);
  color: var(--text-primary); border-radius: 16px 16px 4px 16px;
  font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
}
.msg-assistant { align-self: stretch; display: flex; gap: 16px; position: relative; }
.assistant-avatar {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
  background: radial-gradient(circle at 36% 32%, #eeeaff 0%, #b8b0f0 38%, #7c74c4 75%, #4e4890 100%);
  box-shadow: 0 0 0 1px rgba(124,110,250,0.45), 0 0 12px rgba(124,110,250,0.35);
  position: relative; margin-top: 2px;
}
.assistant-avatar::before {
  content: ''; position: absolute; width: 36%; height: 36%;
  border-radius: 50%; background: rgba(60,50,120,0.32); top: 18%; left: 20%;
  box-shadow: 4px -0.5px 0 0.8px rgba(60,50,120,0.24), 1px 5px 0 0.5px rgba(60,50,120,0.2);
}
.assistant-avatar.thinking { animation: avatar-pulse 1.6s ease-in-out infinite; }
@keyframes avatar-pulse {
  0%, 100% { box-shadow: 0 0 0 1px rgba(124,110,250,0.45), 0 0 12px rgba(124,110,250,0.35); }
  50%       { box-shadow: 0 0 0 1px rgba(124,110,250,0.7),  0 0 28px rgba(124,110,250,0.6); }
}
.assistant-body { flex: 1; min-width: 0; font-size: 15px; line-height: 1.65; color: var(--text-primary); }
.assistant-body p { margin: 0 0 12px; }
.assistant-body p:last-child { margin-bottom: 0; }
.assistant-body strong { color: var(--text-primary); font-weight: 600; }
.assistant-body em { color: var(--text-secondary); }
.assistant-body code {
  background: var(--bg-raised); color: var(--accent-bright);
  border-radius: var(--brand-radius-sm); padding: 1px 6px;
  font-family: var(--brand-font-mono); font-size: 13px;
}
.assistant-body ul, .assistant-body ol { margin: 8px 0 12px; padding-left: 20px; color: var(--text-secondary); }
.assistant-body li { margin-bottom: 4px; }
.assistant-body a { color: var(--accent-bright); text-decoration: underline; text-underline-offset: 2px; }
.assistant-body.error-body { color: var(--error); }
.thinking-text {
  font-family: var(--brand-font-mono); font-size: 12px; color: var(--text-muted);
  letter-spacing: 0.04em; display: inline-flex; align-items: center; gap: 8px;
}
.thinking-text .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); animation: dot-blink 1.2s infinite; }
.thinking-text .dot:nth-child(2) { animation-delay: 0.15s; }
.thinking-text .dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes dot-blink {
  0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
  30%            { opacity: 1;    transform: translateY(-2px); }
}
.caret {
  display: inline-block; width: 8px; height: 1em; margin-left: 2px;
  background: var(--accent); vertical-align: text-bottom;
  animation: caret-blink 1s steps(2) infinite;
}
@keyframes caret-blink { 50% { opacity: 0; } }

/* ── SOURCES STRIP ───────────────────────────────────────────────────────── */
.answer-foot {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px dashed var(--border-subtle);
}
.sources-strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sources-strip .label {
  font-family: var(--brand-font-mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-muted); margin-right: 4px;
}
.source-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px;
  background: var(--bg-surface); border: 1px solid var(--border-soft);
  border-radius: var(--brand-radius-full); font-size: 12px; color: var(--text-secondary);
  transition: all var(--brand-duration-fast) var(--brand-ease-out); max-width: 260px;
}
.source-chip:hover { border-color: var(--accent-border); color: var(--text-primary); background: var(--accent-subtle); }
.source-chip .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; font-family: var(--brand-font-mono); font-size: 9px;
  color: var(--accent-bright); background: var(--accent-subtle); border-radius: 4px;
}
.source-chip .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── COMPOSER ────────────────────────────────────────────────────────────── */
.composer-wrap {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: center; padding: 24px 24px 28px;
  pointer-events: none;
  background: linear-gradient(180deg, transparent, var(--bg-base) 65%);
}
.composer-wrap > * { pointer-events: auto; }
.composer {
  width: 100%; max-width: 720px; display: flex; align-items: flex-end; gap: 10px;
  padding: 8px 8px 8px 16px; background: var(--bg-surface);
  border: 1px solid var(--border-soft); border-radius: 22px;
  transition: all var(--brand-duration-base) var(--brand-ease-out);
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}
[data-theme="light"] .composer { box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
.composer.focused {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow), 0 0 32px var(--accent-glow), 0 4px 24px rgba(0,0,0,0.3);
}
.composer textarea {
  flex: 1; min-height: 28px; max-height: 200px; resize: none;
  border: none; outline: none; background: transparent; color: var(--text-primary);
  font-family: var(--brand-font-body); font-size: 15px; line-height: 1.5; padding: 6px 0;
}
.composer textarea::placeholder { color: var(--text-muted); }
.send-btn {
  flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
  background: var(--accent); color: var(--accent-contrast); border: none;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all var(--brand-duration-fast) var(--brand-ease-out);
}
.send-btn:hover:not(:disabled) {
  background: var(--accent-hover);
  box-shadow: 0 0 0 4px var(--accent-glow), 0 0 24px rgba(124,110,250,0.5);
}
.send-btn:disabled { background: var(--bg-raised); color: var(--text-disabled); cursor: not-allowed; }
.send-btn svg { width: 16px; height: 16px; }
.composer-wrap.in-empty {
  position: relative; background: none; padding: 0;
  width: 100%; max-width: 580px; margin: 4px auto 0;
}

/* ── SOURCE PANEL ────────────────────────────────────────────────────────── */
.source-panel-backdrop {
  position: fixed; inset: 0; background: rgba(10,10,11,0.55);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  z-index: 40; opacity: 0;
  animation: backdrop-in var(--brand-duration-base) var(--brand-ease-out) forwards;
}
[data-theme="light"] .source-panel-backdrop { background: rgba(0,0,0,0.18); }
@keyframes backdrop-in { to { opacity: 1; } }
.source-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 92vw);
  background: var(--bg-surface); border-left: 1px solid var(--border-soft);
  z-index: 41; display: flex; flex-direction: column;
  transform: translateX(100%);
  animation: panel-in var(--brand-duration-base) var(--brand-ease-out) forwards;

}

.source-panel-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;

}
.source-panel-meta { flex: 1; min-width: 0; }
.source-panel-eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.source-folder-tag {
  font-family: var(--brand-font-mono); font-size: 10px; letter-spacing: 0.06em;

}
.source-panel-title {

}
.source-panel-updated { font-family: var(--brand-font-mono); font-size: 11px; color: var(--text-muted); }
.source-panel-content {
  flex: 1; overflow-y: auto; padding: 20px 24px 40px;

.source-panel-content::-webkit-scrollbar { width: 6px; }

.md h1, .md h2, .md h3, .md h4 {
  font-family: var(--brand-font-display); color: var(--text-primary);

}
.md h1 { font-size: 22px; margin-top: 0; }
.md h2 { font-size: 17px; margin-top: 24px; }
.md h3 { font-size: 14px; margin-top: 18px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--brand-font-mono); font-weight: 500; }

  margin: 0 0 12px; padding: 4px 12px; border-left: 2px solid var(--accent);

/* ── API KEY GATE ────────────────────────────────────────────────────────── */
.gate-stage {
  position: relative; z-index: 1; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 32px 24px;
}
.gate-card {
  position: relative; width: 100%; max-width: 480px;
  background: linear-gradient(180deg, rgba(17,17,19,0.85), rgba(17,17,19,0.55));
  border: 1px solid var(--border-soft); border-radius: var(--brand-radius-2xl);
  padding: 40px 36px 32px;
  backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);

  background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));

.gate-orb-wrap { position: relative; width: 64px; height: 64px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
.gate-orb {
  width: 44px; height: 44px; border-radius: 50%;

.gate-orb::before {
  content: ''; position: absolute; width: 36%; height: 36%;
  border-radius: 50%; background: rgba(60,50,120,0.30); top: 18%; left: 20%;

.gate-eyebrow {
  font-family: var(--brand-font-mono); font-size: 10px; letter-spacing: 0.18em;

}

.gate-title { font-family: var(--brand-font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); margin: 0 0 10px; line-height: 1.15; }

.gate-form { text-align: left; display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.gate-input-row {
  display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 14px;

.gate-input-row.error  { border-color: var(--error);  box-shadow: 0 0 0 3px var(--error-bg); }
.gate-input-row input {
  flex: 1; height: 38px; background: transparent; border: none; outline: none;

  width: 30px; height: 30px; background: transparent; border: none; color: var(--text-muted);

.gate-paste {

  border: 1px solid var(--border-subtle); color: var(--text-secondary);
  border-radius: var(--brand-radius-sm); font-family: var(--brand-font-mono); font-size: 11px;
  transition: all var(--brand-duration-fast) var(--brand-ease-out);

.gate-paste:hover { color: var(--text-primary); border-color: var(--border-mid); background: var(--bg-hover); }
.gate-label-row {
  display: flex; align-items: center; justify-content: space-between;

}
.gate-label-row a { color: var(--accent-bright); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; text-transform: none; letter-spacing: 0.02em; font-family: var(--brand-font-body); font-size: 11px; }
.gate-label-row a:hover { color: var(--accent); }
.gate-label-row a svg { width: 10px; height: 10px; }
.gate-error { font-size: 12px; color: var(--error); display: flex; align-items: center; gap: 6px; }
.gate-submit {
  width: 100%; height: 44px; background: var(--accent); color: var(--accent-contrast);
  border: none; border-radius: var(--brand-radius-md);
  font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: all var(--brand-duration-fast) var(--brand-ease-out);
  margin-bottom: 18px;
}
.gate-submit:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 0 0 4px var(--accent-glow), 0 0 32px rgba(124,110,250,0.45); }
.gate-submit:disabled { background: var(--bg-raised); color: var(--text-disabled); cursor: not-allowed; }
.gate-submit svg { width: 14px; height: 14px; }
.gate-foot {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 14px; background: var(--bg-base); border: 1px solid var(--border-subtle);
  border-radius: var(--brand-radius-md); font-family: var(--brand-font-mono);
  font-size: 10px; letter-spacing: 0.04em; color: var(--text-muted);
}
.gate-foot svg { width: 12px; height: 12px; color: var(--success); flex-shrink: 0; }
.gate-foot strong { color: var(--text-secondary); font-weight: 500; }

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
const { useState, useEffect, useRef, useLayoutEffect, useCallback } = React;

const KEY_STORAGE = 'ask-docs:gemini-api-key';

// ── Icons ─────────────────────────────────────────────────────────────────────
const _ic = { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none',
  stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' };

const Icon = {
  Plus:     (p) => <svg {..._ic} {...p}><path d="M12 5v14M5 12h14"/></svg>,
  Send:     (p) => <svg {..._ic} strokeWidth="2.2" {...p}><path d="M5 12h14M13 6l6 6-6 6"/></svg>,
  Sun:      (p) => <svg {..._ic} {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>,
  Moon:     (p) => <svg {..._ic} {...p}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
  Close:    (p) => <svg {..._ic} {...p}><path d="M18 6 6 18M6 6l12 12"/></svg>,
  Refresh:  (p) => <svg {..._ic} {...p}><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>,
  Trash:    (p) => <svg {..._ic} {...p}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14M10 11v6M14 11v6"/></svg>,
  Database: (p) => <svg {..._ic} {...p}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v6c0 1.66 4.03 3 9 3s9-1.34 9-3V5M3 11v6c0 1.66 4.03 3 9 3s9-1.34 9-3v-6"/></svg>,
  Sparkle:  (p) => <svg {..._ic} fill="currentColor" stroke="none" {...p}><path d="M12 2l1.6 4.4L18 8l-4.4 1.6L12 14l-1.6-4.4L6 8l4.4-1.6L12 2zm6 10l.9 2.5L21.5 15l-2.6.5L18 18l-.9-2.5L14.5 15l2.6-.5L18 12z"/></svg>,
  Book:     (p) => <svg {..._ic} {...p}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>,
  Compass:  (p) => <svg {..._ic} {...p}><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/></svg>,
  Briefcase:(p) => <svg {..._ic} {...p}><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
  Key:      (p) => <svg {..._ic} {...p}><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>,
  Eye:      (p) => <svg {..._ic} {...p}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>,
  EyeOff:   (p) => <svg {..._ic} {...p}><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>,
  Check:    (p) => <svg {..._ic} {...p}><path d="M20 6 9 17l-5-5"/></svg>,
  Lock:     (p) => <svg {..._ic} {...p}><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
  External: (p) => <svg {..._ic} {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>,
  Edit:     (p) => <svg {..._ic} {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>,
};

// ── AgMark logo ───────────────────────────────────────────────────────────────
function AgMark({ size = 28 }) {
  return (
    <svg viewBox="0 0 64 64" width={size} height={size} fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#111113"/>
      <path d="M14 46 L24 20 L34 46" stroke="#7C6EFA" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      <line x1="18" y1="37" x2="30" y2="37" stroke="#7C6EFA" strokeWidth="2.5" strokeLinecap="round"/>
      <path d="M38 28 C38 23 42 20 47 20 C52 20 55 23 55 28 L55 32 L49 32 L49 29" stroke="#F0EEF8" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      <path d="M38 28 C38 33 38 38 38 40 C38 43.5 42 46 47 46 C52 46 55 43.5 55 40 L55 32" stroke="#F0EEF8" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

// ── CosmicBackground ──────────────────────────────────────────────────────────
function CosmicBackground({ intensity = 'cosmic' }) {
  const opacity = intensity === 'subtle' ? 0.55 : intensity === 'cosmic' ? 1.0 : 0.8;
  return (
    <div className="cosmic-bg" style={{ '--orb-opacity': opacity }}>
      <div className="cosmic-orb primary"/>
      <div className="cosmic-orb secondary"/>
      {intensity !== 'subtle' && <div className="starfield"/>}
      <div className="cosmic-vignette"/>
    </div>
  );
}

// ── ApiKeyGate ────────────────────────────────────────────────────────────────
function ApiKeyGate({ onSubmit }) {
  const [value, setValue] = useState('');
  const [show, setShow] = useState(false);
  const [focused, setFocused] = useState(false);
  const [err, setErr] = useState(null);
  const inputRef = useRef(null);

  useEffect(() => { inputRef.current?.focus(); }, []);

  const validate = (v) => {
    if (!v.trim()) return 'Paste your Gemini API key.';
    if (v.trim().length < 20) return "That doesn't look like a valid key — check Google AI Studio.";
    return null;
  };

  const handleSubmit = (e) => {
    e?.preventDefault();
    const v = value.trim();
    const e2 = validate(v);
    if (e2) { setErr(e2); return; }
    onSubmit(v);
  };

  const handlePaste = async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) { setValue(text.trim()); setErr(null); }
    } catch { inputRef.current?.focus(); }
  };

  return (
    <div className="gate-stage">
      <div className="gate-card">
        <div className="gate-orb-wrap"><div className="gate-orb"/></div>

        <div className="gate-eyebrow">
          <span className="line"/>One last thing<span className="line"/>
        </div>

        <h1 className="gate-title">Connect your <span className="accent">Gemini</span> key</h1>
        <p className="gate-sub">
          Ask Docs uses Gemini to answer questions over your notes. Your key stays on this device — we never see it.
        </p>

        <form className="gate-form" onSubmit={handleSubmit}>
          <div className="gate-label-row">
            <span>Gemini API key</span>
            <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">
              Get one from AI Studio <Icon.External/>
            </a>
          </div>

          <div className={`gate-input-row${focused ? ' focused' : ''}${err ? ' error' : ''}`}>
            <input
              ref={inputRef}
              type={show ? 'text' : 'password'}
              placeholder="AIzaSy…"
              value={value}
              onChange={(e) => { setValue(e.target.value); if (err) setErr(null); }}
              onFocus={() => setFocused(true)}
              onBlur={() => setFocused(false)}
              autoComplete="off"
              spellCheck={false}
            />
            <button type="button" className="gate-paste" onClick={handlePaste}>paste</button>
            <button type="button" className="gate-eye" onClick={() => setShow(s => !s)}>
              {show ? <Icon.EyeOff/> : <Icon.Eye/>}
            </button>
          </div>

          {err && (
            <div className="gate-error">
              <span style={{ width: 4, height: 4, borderRadius: '50%', background: 'var(--error)', flexShrink: 0 }}/>
              {err}
            </div>
          )}

          <button type="submit" className="gate-submit" disabled={!value.trim()}>
            <Icon.Check/> Connect &amp; start asking
          </button>
        </form>

        <div className="gate-foot">
          <Icon.Lock/>
          <span><strong>Stored locally</strong> · localStorage on this device only</span>
        </div>
      </div>
    </div>
  );
}

// ── KeyChip ───────────────────────────────────────────────────────────────────
function KeyChip({ apiKey, onUpdate, onForget }) {
  const [open, setOpen] = useState(false);
  const chipRef = useRef(null);

function UserMessage({ text }) {

function renderMd(text) {
  const paragraphs = [];
  const lines = text.split('\n');
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
        i++;
      }
      paragraphs.push({ kind: 'ul', items });
      continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() !== '' && !/^\s*[-*]\s+/.test(lines[i])) {
      buf.push(lines[i]);
      i++;
    }
    if (buf.length) paragraphs.push({ kind: 'p', text: buf.join(' ') });
    while (i < lines.length && lines[i].trim() === '') i++;
  }

  return paragraphs.map((p, idx) => {
    if (p.kind === 'ul') return <ul key={idx}>{p.items.map((it, j) => <li key={j}>{renderInline(it)}</li>)}</ul>;
    return <p key={idx}>{renderInline(p.text)}</p>;
  });
}

function renderInline(text) {
  const out = [];
  let buf = '';
  let i = 0;
  const flush = () => { if (buf) { out.push(buf); buf = ''; } };

  while (i < text.length) {
    if (text[i] === '`') {
      const end = text.indexOf('`', i + 1);
      if (end > -1) { flush(); out.push(<code key={`c${i}`}>{text.slice(i+1, end)}</code>); i = end + 1; continue; }
    }
    if (text[i] === '*' && text[i+1] === '*') {
      const end = text.indexOf('**', i + 2);
      if (end > -1) { flush(); out.push(<strong key={`b${i}`}>{text.slice(i+2, end)}</strong>); i = end + 2; continue; }
    }
    if (text[i] === '*' && text[i+1] !== '*') {
      const end = text.indexOf('*', i + 1);
      if (end > -1 && text[end+1] !== '*') { flush(); out.push(<em key={`e${i}`}>{text.slice(i+1, end)}</em>); i = end + 1; continue; }
    }
    buf += text[i];
    i++;
  }
  flush();
  return out;
}

// ── streamChat ────────────────────────────────────────────────────────────────
async function streamChat(query, apiKey, history, { onToken, onToolCall, onToolResult, onDone, onError }, signal) {
  let resp;
  try {
    resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, api_key: apiKey, history }),
      signal,
    });
  } catch (e) {
    if (e.name !== 'AbortError') onError(e.message);
    return;
  }

  if (!resp.ok) {
    let detail = `HTTP ${resp.status}`;
    try { const j = await resp.json(); detail = j.detail || detail; } catch {}
    onError(detail);
    return;
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';

  while (true) {
    let chunk;
    try { chunk = await reader.read(); } catch (e) { if (e.name !== 'AbortError') onError(e.message); return; }
    if (chunk.done) break;
    if (signal?.aborted) return;

    buf += decoder.decode(chunk.value, { stream: true });

    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const raw = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      let event = 'message', data = '';
      for (const line of raw.split('\n')) {
        if (line.startsWith('event:')) event = line.slice(6).trim();
        else if (line.startsWith('data:')) data = line.slice(5).trim();
      }
      let parsed = data;
      try { parsed = JSON.parse(data); } catch {}

      switch (event) {
        case 'token':       onToken(typeof parsed === 'string' ? parsed : (parsed?.data ?? '')); break;
        case 'tool_call':   onToolCall(parsed); break;
        case 'tool_result': onToolResult(parsed); break;
        case 'done':        onDone(parsed); return;
        case 'error':       onError(parsed?.detail || 'Unknown error'); return;
      }
    }
  }
  onDone({ answer: '' });
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [theme, setTheme] = useState('dark');
  const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem(KEY_STORAGE) || ''; } catch { return ''; } });
  const [editingKey, setEditingKey] = useState(false);
  const [messages, setMessages] = useState([]);
  const [composerValue, setComposerValue] = useState('');
  const [isAnswering, setIsAnswering] = useState(false);
  const [openSource, setOpenSource] = useState(null);
  const [docCount, setDocCount] = useState(0);
  const [chunkCount, setChunkCount] = useState(0);
  const [isReindexing, setIsReindexing] = useState(false);
  const [toast, setToast] = useState(null);

  const historyRef = useRef([]);
  const abortRef   = useRef(null);
  const scrollRef  = useRef(null);

  // Apply theme to <html>
  useEffect(() => {
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }, [theme]);

  // Fetch stats on mount and periodically
  const refreshStats = useCallback(async () => {
    try {
      const r = await fetch('/stats');
      if (r.ok) { const j = await r.json(); setDocCount(j.docs_indexed ?? 0); setChunkCount(j.chunks_indexed ?? 0); }
    } catch {}
  }, []);

  useEffect(() => {
    refreshStats();
    const id = setInterval(refreshStats, 30000);
    return () => clearInterval(id);
  }, [refreshStats]);

  // Auto-scroll
  useEffect(() => {
    const el = scrollRef.current;
    if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
  }, [messages]);

  // ⌘K → new chat
  useEffect(() => {
    const onKey = (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); newChat(); } };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const saveKey = (k) => { try { localStorage.setItem(KEY_STORAGE, k); } catch {} setApiKey(k); setEditingKey(false); };
  const forgetKey = () => { try { localStorage.removeItem(KEY_STORAGE); } catch {} setApiKey(''); setEditingKey(false); };
  const newChat = () => {
    if (abortRef.current) abortRef.current.abort();
    setMessages([]); setComposerValue(''); setOpenSource(null);
    historyRef.current = [];
  };

  // Update the last message in the list (always the current assistant turn)
  const updateLast = (fn) => setMessages(prev => {
    const out = [...prev];
    if (out.length && out[out.length - 1].role === 'assistant') {
      out[out.length - 1] = fn(out[out.length - 1]);
    }
    return out;
  });

  const submitMessage = useCallback(async (rawText) => {
    const text = (rawText ?? composerValue).trim();
    if (!text || isAnswering) return;

    const snapshot = [...historyRef.current];
    setComposerValue('');
    setIsAnswering(true);

    const allSources = [];

    setMessages(prev => [
      ...prev,
      { role: 'user', content: text },
      { role: 'assistant', content: '', sources: [], thinking: true, streaming: false, error: false, thinkingLabel: 'searching your docs…' },
    ]);

    const ac = new AbortController();
    abortRef.current = ac;

    try {
      await streamChat(
        text, apiKey, snapshot,
        {
          onToken: (tok) => updateLast(m => ({
            ...m, thinking: false, streaming: true, content: m.content + tok,
          })),
          onToolCall: (fc) => updateLast(m => ({
            ...m, thinkingLabel: `calling ${fc.name}…`,
          })),
          onToolResult: (tr) => {
            if (Array.isArray(tr.result)) {
              for (const hit of tr.result) {
                if (hit.path && !allSources.find(s => s.path === hit.path)) {
                  allSources.push({ title: hit.title || hit.path, path: hit.path, snippet: hit.snippet || '' });
                }
              }
            }
            updateLast(m => ({ ...m, sources: [...allSources], thinkingLabel: `found ${allSources.length} source(s)…` }));
          },
          onDone: (payload) => {
            const answer = payload?.answer || '';
            const isFallback = !!payload?.fallback;
            updateLast(m => {
              const finalContent = m.content || answer;
              if (!isFallback && finalContent) {
                historyRef.current.push({ role: 'user', content: text });
                historyRef.current.push({ role: 'assistant', content: finalContent });
              }
              return { ...m, content: finalContent, thinking: false, streaming: false, sources: allSources };
            });
          },
          onError: (detail) => updateLast(m => ({
            ...m, thinking: false, streaming: false, error: true, content: detail,
          })),
        },
        ac.signal,
      );
    } catch (e) {
      updateLast(m => ({ ...m, thinking: false, streaming: false, error: true, content: e.message }));
    } finally {
      setIsAnswering(false);
      abortRef.current = null;
    }
  }, [composerValue, isAnswering, apiKey]);

  const onReindex = async () => {
    if (isReindexing) return;
    setIsReindexing(true);
    setToast({ text: 'Reindexing new docs…', kind: 'info' });
    try {
      const r = await fetch('/admin/reindex', { method: 'POST' });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.statusText);
      const n = j.new ?? '?', c = j.chunks_added ?? '?';
      setToast({ text: `Done — ${n} new doc(s), ${c} chunks added`, kind: 'success' });
      await refreshStats();
    } catch (e) {
      setToast({ text: `Reindex failed: ${e.message}`, kind: 'error' });
    } finally {
      setIsReindexing(false);
    }
  };

  const onWipeReindex = async () => {
    setToast({ text: 'Wiping index…', kind: 'info' });
    try {
      const r = await fetch('/admin/wipe', { method: 'POST' });
      if (!r.ok) throw new Error(r.statusText);
      setDocCount(0); setChunkCount(0);
      setToast({ text: 'Index wiped — reindex to start querying.', kind: 'error' });
    } catch (e) {
      setToast({ text: `Wipe failed: ${e.message}`, kind: 'error' });
    }
  };

  const isEmpty = messages.length === 0;
  const showGate = !apiKey || editingKey;

  return (
    <>
      <CosmicBackground intensity="cosmic"/>

      {showGate ? (
        <ApiKeyGate onSubmit={(k) => { saveKey(k); setToast({ text: 'Gemini key saved · ready to ask', kind: 'success' }); }}/>
      ) : (
        <div className="shell">
          <Header
            docCount={docCount}
            chunkCount={chunkCount}
            onNewChat={newChat}
            onReindex={onReindex}
            onWipeReindex={onWipeReindex}
            isReindexing={isReindexing}
            theme={theme}
            onToggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
            apiKey={apiKey}
            onUpdateKey={() => setEditingKey(true)}
            onForgetKey={() => { forgetKey(); setToast({ text: 'Gemini key forgotten', kind: 'info' }); }}
          />

          <div className="chat-region">
            <div ref={scrollRef} className="chat-scroll" style={{ width: '100%' }}>
              <div className={`chat-inner${isEmpty ? ' is-empty' : ''}`}>
                {isEmpty ? (
                  <>
                    <EmptyState onPick={(t) => submitMessage(t)}/>
                    <Composer
                      value={composerValue}
                      onChange={setComposerValue}
                      onSubmit={() => submitMessage()}
                      disabled={isAnswering}
                      autoFocus
                      inEmpty
                      placeholder="Ask your second brain anything…"
                    />
                  </>
                ) : (
                  <div className="msg-pair">
                    {messages.map((m, idx) =>
                      m.role === 'user' ? (
                        <UserMessage key={idx} text={m.content}/>
                      ) : (
                        <AssistantMessage
                          key={idx}
                          text={m.content}
                          isStreaming={m.streaming}
                          isThinking={m.thinking}
                          thinkingLabel={m.thinkingLabel}
                          sources={m.sources}
                          onSourceClick={setOpenSource}
                          error={m.error}
                        />
                      )
                    )}
                  </div>
                )}
              </div>
            </div>

            {!isEmpty && (
              <Composer
                value={composerValue}
                onChange={setComposerValue}
                onSubmit={() => submitMessage()}
                disabled={isAnswering}
                autoFocus
              />
            )}
          </div>
        </div>
      )}

      {openSource && <SourcePanel source={openSource} onClose={() => setOpenSource(null)}/>}
      {toast && <Toast text={toast.text} kind={toast.kind} onDone={() => setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
