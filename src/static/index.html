<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask your docs</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --muted: #8a93a6;
    --fg: #e6e9ef;
    --accent: #7aa2f7;
    --user: #2a3447;
    --assistant: #1c2230;
    --tool: #1a2018;
    --tool-border: #3d5224;
    --error: #4a1a1a;
    --border: #2a3040;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border);
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  header .status { font-size: 12px; color: var(--muted); }
  header .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                        background: #444; margin-right: 6px; vertical-align: middle; }
  header .status .dot.ok { background: #6ad36a; }
  header .status .dot.bad { background: #d36a6a; }
  .btn-key { font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
             background: transparent; color: var(--muted); cursor: pointer; }
  .btn-key:hover { border-color: var(--accent); color: var(--accent); }
  .adminbar { border-bottom: 1px solid var(--border); padding: 8px 20px;
              display: flex; align-items: center; gap: 10px; background: var(--panel); }
  .adminbar .admin-label { font-size: 11px; color: var(--muted); text-transform: uppercase;
                           letter-spacing: 0.06em; margin-right: 4px; }
  .adminbar button { font-size: 12px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border);
                     background: transparent; color: var(--fg); cursor: pointer; }
  .adminbar button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .adminbar button.danger:hover:not(:disabled) { border-color: #d36a6a; color: #d36a6a; }
  .adminbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .adminbar .admin-status { font-size: 12px; color: var(--muted); margin-left: 6px; }
  main { flex: 1; overflow-y: auto; padding: 20px; max-width: 920px; width: 100%;
         margin: 0 auto; }
  .msg { margin-bottom: 14px; padding: 12px 14px; border-radius: 8px;
         border: 1px solid var(--border); white-space: pre-wrap; word-wrap: break-word; }
  .msg .role { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
               color: var(--muted); margin-bottom: 6px; }
  .msg.user { background: var(--user); }
  .msg.assistant { background: var(--assistant); }
  .msg.error { background: var(--error); }
  .tool { background: var(--tool); border-color: var(--tool-border);
          margin-bottom: 10px; padding: 10px 12px; border-radius: 6px;
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 12.5px; }
  .tool .head { color: #9fcc5f; font-weight: 600; cursor: pointer;
                user-select: none; display: flex; align-items: center; }
  .tool .head::before { content: "▶"; font-size: 9px; margin-right: 6px; transition: transform 0.1s; }
  .tool.open .head::before { transform: rotate(90deg); }
  .tool .body { display: none; margin-top: 8px; }
  .tool.open .body { display: block; }
  .tool pre { margin: 4px 0; padding: 8px; background: rgba(0,0,0,0.25); border-radius: 4px;
              overflow-x: auto; max-height: 260px; white-space: pre-wrap; word-wrap: break-word; }
  .tool .label { color: var(--muted); font-size: 11px; text-transform: uppercase;
                 letter-spacing: 0.06em; }
  footer { border-top: 1px solid var(--border); padding: 12px 20px; }
  .composer { max-width: 920px; margin: 0 auto; display: flex; gap: 8px; }
  .composer textarea { flex: 1; resize: none; height: 44px; max-height: 200px;
                       background: var(--panel); color: var(--fg); border: 1px solid var(--border);
                       border-radius: 8px; padding: 10px 12px; font: inherit; }
  .composer button { background: var(--accent); color: #0f1115; border: 0; border-radius: 8px;
                     padding: 0 18px; font-weight: 600; cursor: pointer; }
  .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 6px; text-align: center; }
  .cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent);
            vertical-align: text-bottom; animation: blink 1s steps(2) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* API key modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7);
                   display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.hidden { display: none; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
           padding: 28px 32px; width: 420px; max-width: 90vw; }
  .modal h2 { margin: 0 0 6px; font-size: 17px; }
  .modal p { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .modal input { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border);
                 border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 14px; }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal .modal-actions button { padding: 8px 18px; border-radius: 8px; font-weight: 600;
                                  cursor: pointer; font-size: 14px; }
  .modal .btn-save { background: var(--accent); color: #0f1115; border: 0; }
  .modal .btn-cancel { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .modal .btn-cancel:hover { color: var(--fg); border-color: var(--fg); }
  .modal .error-msg { color: #d36a6a; font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>

<!-- API key modal -->
<div class="modal-overlay hidden" id="keyModal">
  <div class="modal">
    <h2>Gemini API Key</h2>
    <p>Enter your Google Gemini API key. Get one free at <strong>aistudio.google.com</strong>.<br>
       The key is stored locally in your browser and never sent anywhere except Google's API.</p>
    <input type="password" id="keyInput" placeholder="AIza…" autocomplete="off" spellcheck="false">
    <div class="error-msg" id="keyError"></div>
    <div class="modal-actions">
      <button class="btn-cancel hidden" id="btnCancelKey">Cancel</button>
      <button class="btn-save" id="btnSaveKey">Save key</button>
    </div>
  </div>
</div>

<header>
  <h1>Ask your docs</h1>
  <div class="header-right">
    <div class="status" id="status"><span class="dot"></span>checking…</div>
    <button class="btn-key" id="btnChangeKey">API key</button>
  </div>
</header>

<div class="adminbar">
  <span class="admin-label">index</span>
  <button id="btnReindex">Reindex new docs</button>
  <button id="btnWipe" class="danger">Wipe &amp; reindex all</button>
  <span class="admin-status" id="adminStatus"></span>
</div>

<main id="transcript"></main>
<footer>
  <div class="composer">
    <textarea id="input" placeholder="Ask anything about your docs… (Cmd/Ctrl+Enter to send)"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="hint" id="modelLine"></div>
</footer>

<script>
const transcript = document.getElementById("transcript");
const input = document.getElementById("input");
const send = document.getElementById("send");
const statusEl = document.getElementById("status");
const modelLine = document.getElementById("modelLine");
const keyModal = document.getElementById("keyModal");
const keyInput = document.getElementById("keyInput");
const keyError = document.getElementById("keyError");
const btnSaveKey = document.getElementById("btnSaveKey");
const btnCancelKey = document.getElementById("btnCancelKey");
const btnChangeKey = document.getElementById("btnChangeKey");
const btnReindex = document.getElementById("btnReindex");
const btnWipe = document.getElementById("btnWipe");
const adminStatus = document.getElementById("adminStatus");

const history = [];
const KEY_STORAGE = "gemini_api_key";

// --- API key management ---

function getKey() { return localStorage.getItem(KEY_STORAGE) || ""; }

function showKeyModal(cancellable) {
  keyInput.value = getKey();
  keyError.textContent = "";
  btnCancelKey.classList.toggle("hidden", !cancellable);
  keyModal.classList.remove("hidden");
  setTimeout(() => keyInput.focus(), 50);
}

function hideKeyModal() { keyModal.classList.add("hidden"); }

btnSaveKey.addEventListener("click", () => {
  const val = keyInput.value.trim();
  if (!val) { keyError.textContent = "Key cannot be empty."; return; }
  localStorage.setItem(KEY_STORAGE, val);
  hideKeyModal();
});

btnCancelKey.addEventListener("click", hideKeyModal);

keyInput.addEventListener("keydown", e => {
  if (e.key === "Enter") btnSaveKey.click();
  if (e.key === "Escape") btnCancelKey.click();
});

btnChangeKey.addEventListener("click", () => showKeyModal(true));

// Show modal on load if no key
if (!getKey()) showKeyModal(false);

// --- Health check ---

async function checkHealth() {
  try {
    const r = await fetch("/healthz");
    const j = await r.json();
    const allOk = j.mcp === "ok";
    statusEl.innerHTML = `<span class="dot ${allOk ? "ok" : "bad"}"></span>` +
      `mcp ${j.mcp} · ${j.tools_loaded} tools`;
    modelLine.textContent = `model: ${j.model}`;
  } catch {
    statusEl.innerHTML = `<span class="dot bad"></span>agent unreachable`;
  }
}
checkHealth();
setInterval(checkHealth, 15000);

// --- Admin actions ---

function setAdminBusy(msg) {
  btnReindex.disabled = true;
  btnWipe.disabled = true;
  adminStatus.textContent = msg;
  adminStatus.style.color = "var(--muted)";
}

function setAdminDone(msg, ok) {
  btnReindex.disabled = false;
  btnWipe.disabled = false;
  adminStatus.textContent = msg;
  adminStatus.style.color = ok ? "#6ad36a" : "#d36a6a";
  setTimeout(() => { adminStatus.textContent = ""; }, 6000);
}

async function adminAction(endpoint, busyMsg) {
  setAdminBusy(busyMsg);
  try {
    const r = await fetch(endpoint, { method: "POST" });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    if (endpoint.includes("wipe")) {
      setAdminDone("Index wiped — click Reindex to populate.", true);
    } else {
      const n = j.new ?? "?";
      const c = j.chunks_added ?? "?";
      setAdminDone(`Done — ${n} new doc(s), ${c} chunks added`, true);
    }
  } catch (e) {
    setAdminDone(`Error: ${e.message}`, false);
  }
}

btnReindex.addEventListener("click", () => adminAction("/admin/reindex", "Indexing new docs…"));
btnWipe.addEventListener("click", () => {
  if (!confirm("Delete the entire index and reindex all docs from scratch?")) return;
  adminAction("/admin/wipe", "Wiping index…");
});

// --- Chat UI ---

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function addUser(text) {
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div class="role">you</div><div>${escapeHtml(text)}</div>`;
  transcript.appendChild(div);
  scroll();
}

function startAssistant() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = `<div class="role">assistant</div><div class="content"></div><span class="cursor"></span>`;
  transcript.appendChild(div);
  scroll();
  return div;
}

function addTool(name, args) {
  const div = document.createElement("div");
  div.className = "tool";
  div.innerHTML = `
    <div class="head">tool · ${escapeHtml(name)}</div>
    <div class="body">
      <div class="label">arguments</div>
      <pre>${escapeHtml(JSON.stringify(args, null, 2))}</pre>
      <div class="label">result</div>
      <pre class="result">…running</pre>
    </div>`;
  div.querySelector(".head").addEventListener("click", () => div.classList.toggle("open"));
  transcript.appendChild(div);
  scroll();
  return div;
}

function addError(text) {
  const div = document.createElement("div");
  div.className = "msg error";
  div.innerHTML = `<div class="role">error</div><div>${escapeHtml(text)}</div>`;
  transcript.appendChild(div);
  scroll();
}

function scroll() { transcript.scrollTop = transcript.scrollHeight; }

function newAssistantBubble() {
  const bubble = startAssistant();
  return { bubble, content: bubble.querySelector(".content"), cursor: bubble.querySelector(".cursor"), text: "" };
}

function finalizeBubble(b) {
  if (b && b.cursor && b.cursor.parentNode) b.cursor.remove();
  if (b && b.bubble && !b.text) b.bubble.remove();
}

async function ask() {
  const text = input.value.trim();
  if (!text) return;

  const apiKey = getKey();
  if (!apiKey) { showKeyModal(false); return; }

  input.value = "";
  input.style.height = "44px";
  send.disabled = true;

  addUser(text);
  let assistant = newAssistantBubble();
  let needsNewBubble = false;
  let pendingTool = null;
  let finalAnswer = "";

  let resp;
  try {
    resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: text, api_key: apiKey, history })
    });
  } catch (e) {
    finalizeBubble(assistant);
    addError(`Request failed: ${e.message}`);
    send.disabled = false;
    return;
  }

  if (!resp.ok) {
    finalizeBubble(assistant);
    addError(`HTTP ${resp.status}`);
    send.disabled = false;
    return;
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });

    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      let event = "message", data = "";
      for (const line of raw.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      let parsed = data;
      try { parsed = JSON.parse(data); } catch (_) {}

      if (event === "token") {
        if (needsNewBubble) { assistant = newAssistantBubble(); needsNewBubble = false; }
        assistant.text += parsed;
        assistant.content.textContent = assistant.text;
        finalAnswer += parsed;
        scroll();
      } else if (event === "tool_call") {
        finalizeBubble(assistant);
        pendingTool = addTool(parsed.name, parsed.args);
        needsNewBubble = true;
      } else if (event === "tool_result") {
        if (pendingTool) {
          pendingTool.querySelector(".result").textContent =
            typeof parsed.result === "string" ? parsed.result : JSON.stringify(parsed.result, null, 2);
          pendingTool = null;
        }
      } else if (event === "error") {
        finalizeBubble(assistant);
        addError(parsed.detail || JSON.stringify(parsed));
        send.disabled = false;
        return;
      } else if (event === "done") {
        const doneAns = (parsed && typeof parsed.answer === "string") ? parsed.answer : "";
        const isFallback = !!(parsed && parsed.fallback);
        if (!assistant.text && doneAns) {
          if (needsNewBubble) { assistant = newAssistantBubble(); needsNewBubble = false; }
          assistant.text = doneAns;
          assistant.content.textContent = doneAns;
        }
        finalizeBubble(assistant);
        if (!isFallback) {
          history.push({ role: "user", content: text });
          const ans = doneAns || finalAnswer;
          if (ans) history.push({ role: "assistant", content: ans });
        }
        send.disabled = false;
        return;
      }
    }
  }
  finalizeBubble(assistant);
  send.disabled = false;
}

send.addEventListener("click", ask);
input.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); ask(); }
});
input.addEventListener("input", () => {
  input.style.height = "44px";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});
</script>
</body>
</html>
